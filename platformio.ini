[env:esp32dev]

; Платформа и микроконтроллер
platform = espressif32
board = esp32dev
framework = arduino

; Скорость загрузки прошивки
; upload_speed = 115200

; Скорость Serial Monitor
monitor_speed = 115200

; lib_deps = библиотеки, устанавливаемые PlatformIO
lib_deps =
    https://github.com/pschatzmann/ESP32-A2DP
    https://github.com/pschatzmann/arduino-audio-tools.git

; build_flags = подключить вывод через AudioTools
build_flags = -DA2DP_I2S_AUDIOTOOLS=1
              -Iexperiments

; board_build.partitions = разметка памяти для приложения
board_build.partitions = huge_app.csv
